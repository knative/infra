org: knative-extensions
repo: func-adapter-kafka
branches: [main]
image: us-docker.pkg.dev/knative-tests/images/prow-tests:v20261015-2477bb44a

jobs:
  - name: continuous
    types: [periodic]
    command: [runner.sh, ./test/presubmit-tests.sh, --all-tests]

  - name: nightly
    types: [periodic]
    command: [runner.sh, ./hack/release.sh, --publish, --tag-release]
    requirements: [nightly]
    max_concurrency: 1
    excluded_requirements: [gcp]

  - name: release
    types: [periodic]
    command: [runner.sh, ./hack/release.sh, --auto-release, --release-gcs, knative-releases/func-adapter-kafka, --release-gcr, gcr.io/knative-releases, --github-token, /etc/hub-token/token]
    requirements: [release]
    max_concurrency: 1
    excluded_requirements: [gcp]