org: knative-extensions
repo: backstage-plugins
branches: [main]
image: us-docker.pkg.dev/knative-tests/images/prow-tests:v20261102-2071337d7

jobs:

  - name: build-tests
    types: [presubmit]
    command: [runner.sh, ./test/presubmit-tests.sh, --build-tests]
    excluded_requirements: [gcp]

  - name: unit-tests
    types: [ presubmit ]
    resources: default
    command: [ runner.sh, ./test/presubmit-tests.sh, --unit-tests ]
    excluded_requirements: [ gcp ]

  - name: e2e-tests
    types: [presubmit]
    command: [runner.sh, ./test/presubmit-tests.sh, --run-test, ./test/e2e-tests.sh]

  - name: continuous
    types: [periodic]
    command: [runner.sh, ./test/presubmit-tests.sh, --all-tests]
    requirements: [docker]

resources: default
resources_presets:
  default:
    limits:
      memory: 10Gi
    requests:
      memory: 8Gi
