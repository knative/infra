kind: Gateway
apiVersion: gateway.networking.k8s.io/v1beta1
metadata:
  name: https-lb
  namespace: default
  annotations:
    networking.gke.io/certmap: knative-dev
spec:
  gatewayClassName: gke-l7-gxlb
  listeners:
  - name: https
    protocol: HTTPS
    port: 443
    allowedRoutes:
      namespaces:
        from: Selector
        selector:
          matchExpressions:
          - key: kubernetes.io/metadata.name
            operator: In
            values:
            - monitoring
            - redirects
  # Only the redirect namespace may attach routes to the HTTP listener.
  # Existing infrastructure applications remain HTTPS-only.
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: Selector
        selector:
          matchLabels:
            kubernetes.io/metadata.name: redirects
  addresses:
  - type: NamedAddress
    value: knative-infra-ingress
