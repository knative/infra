# Reuse the existing HTTPS Gateway and its wildcard knative.dev certificate.
apiVersion: v1
kind: Namespace
metadata:
  name: redirects
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: testgrid-redirect
  namespace: redirects
spec:
  parentRefs:
    - name: https-lb
      namespace: default
  hostnames:
    - testgrid.knative.dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: testgrid.k8s.io
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /r/knative-own-testgrid
            statusCode: 302
---
apiVersion: gateway.networking.k8s.io/v1beta1
